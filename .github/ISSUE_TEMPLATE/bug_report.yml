name: Bug report
description: Something in this plugin behaves differently from what it documents.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste API keys, tokens, or the contents of a config file
        that holds secrets. Redact them first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: From the Plugin Manager, or the `version` in package.json.
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: "dsh --version"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "node --version"
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Harness log lines or browser console output. Redact secrets.
      render: text
